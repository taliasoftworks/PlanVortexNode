name: Release

# El tag es lo que publica. `workflow_dispatch` esta ademas para poder relanzar el publish sin
# mover el tag: cuando lo que falla es la fontaneria de npm y no el codigo, retaguear cada intento
# ensucia el historico de una release. Asi salio la 0.1.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing (OIDC): npm verifica que el paquete sale de ESTE repo y de este
      # workflow, y emite una credencial de un solo uso. No hay NPM_TOKEN en los secretos de
      # GitHub, que es justo el secreto que se filtra en cuanto alguien tiene acceso de escritura.
      #
      # OJO: esto firma la provenance Y autentica, pero son dos cosas SEPARADAS. La firma sale de
      # `id-token: write` y funciona sola; la credencial sale de un intercambio contra npm que
      # exige npm >= 11.5.1 y un publicador de confianza que case. Cuando no casa, npm firma la
      # provenance igual y el PUT se va sin credencial: el sintoma es un `E404` que parece decir
      # que el paquete no existe y significa que no tienes permiso. La 0.1.0 se comio tres
      # intentos por eso, y la causa era que en npmjs.com el repo estaba escrito `PlanvortexNode`
      # en vez de `PlanVortexNode`. npm compara ese string tal cual y no dice que campo falla.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) necesita npm >= 11.5.1, y Node 22 trae npm 10.x.
      - run: npm install -g npm@latest

      # Un tag se puede volver a empujar (para moverlo al commit que de verdad se publico, por
      # ejemplo) y entonces esto corre otra vez sobre una version que ya esta en npm. Sin este
      # paso, el resultado es un run en rojo con un E403 que no significa nada malo. Con el, la
      # release es idempotente: si esa version ya existe, no se publica y el run acaba en verde.
      - name: Esta version ya esta publicada?
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publicada=si" >> "$GITHUB_OUTPUT"
            echo "$name@$version ya esta en npm: no se publica nada."
          else
            echo "publicada=no" >> "$GITHUB_OUTPUT"
            echo "$name@$version no esta en npm: se publica."
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:exports

      # `--provenance` firma de donde sale el tarball; npm lo enseña en la ficha del paquete y
      # `npm audit signatures` lo verifica en la maquina de quien lo instala.
      - name: Publicar en npm
        if: steps.published.outputs.publicada == 'no'
        run: npm publish --provenance --access public

      - name: Nada que publicar
        if: steps.published.outputs.publicada == 'si'
        run: echo "La version ${{ steps.published.outputs.version }} ya estaba publicada. Sube la version en package.json, el CHANGELOG y src/version.ts antes de etiquetar."
