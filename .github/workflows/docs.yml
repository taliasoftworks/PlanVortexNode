name: Docs

# La referencia de TypeDoc, publicada en GitHub Pages en cada push a main:
# https://taliasoftworks.github.io/PlanVortexNode/
#
# OJO, ESTO NO ARRANCA SOLO: hay que poner Settings > Pages > Source en "GitHub Actions" una vez.
# Mientras no este puesto, el job de deploy falla con un 404 que no dice que le falta eso.
#
# `docs/` esta en .gitignore a proposito: la referencia se genera, no se commitea. Lo que se sube
# como artefacto es lo que acaba de salir de `npm run docs`, asi que no puede quedarse vieja.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Un despliegue cada vez, y sin cancelar el que este a medio subir: cancelar un deploy de Pages
# deja la pagina a medias.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # TypeDoc lee los mismos ficheros que el build, asi que un JSDoc que no compila se ve
            # aqui antes que en la web.
            - run: npm run docs
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: docs

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
